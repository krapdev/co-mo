<style>
/* ============================================================
   PALETTE
   Parchemin par defaut ; chaque ecran peut se teinter aux couleurs
   d'une equipe en posant .t-lichen / .t-braise sur #app.
   ============================================================ */
:root{
  --font:"Arial Rounded MT Bold","Trebuchet MS",Verdana,system-ui,-apple-system,"Segoe UI",sans-serif;
  --parch:#f3e6c8;

  --creme:#fffaea;
  --or:#e8b93a;
  --menthe:#7ec6b1;

  --braise:#d8511f;  --braise-encre:#fdf3de;  --braise-fond:#8f3410;
  --bg:var(--parch);
  --ink:var(--sombre);
  --bandeau-h:64px;
}

html,body{margin:0;padding:0;overscroll-behavior:none;height:100%}
body{
  background:radial-gradient(120% 90% at 50% 0%,#cbb894 0%,#a8956f 100%),#b9a582;
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;padding:22px;
}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font-family:var(--font)}

/* ============================================================
   L'APPAREIL
   Le cadre 390x844 est un confort de bureau. Des que la fenetre
   ne peut plus l'accueillir - un vrai telephone, une PWA installee -
   l'app prend tout l'ecran et respecte l'encoche.
   ============================================================ */
#app{
  position:relative;width:390px;height:844px;flex:none;
  border-radius:40px;overflow:hidden;
  background:var(--bg);color:var(--ink);
  box-shadow:0 34px 70px rgba(58,38,16,.5),0 0 0 9px #2b241c,0 0 0 10px rgba(255,255,255,.12);
}
#app.t-lichen{--bg:var(--lichen);--ink:var(--lichen-encre)}
#app.t-braise{--bg:var(--braise);--ink:var(--braise-encre)}

@media (max-width:433px),(max-height:887px){
  body{padding:0;background:var(--parch)}
  #app{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
}

/* Grain de papier et vignettage, par-dessus la teinte. */
.grain,.sheen{position:absolute;inset:0;pointer-events:none}
.grain{
  background-image:
    repeating-linear-gradient(0deg,rgba(70,50,25,.045) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(70,50,25,.035) 0 1px,transparent 1px 4px),
    radial-gradient(130% 100% at 50% -10%,rgba(255,246,220,.28) 0%,transparent 55%),
    radial-gradient(120% 90% at 50% 110%,rgba(40,24,8,.18) 0%,transparent 60%);
  mix-blend-mode:multiply;opacity:.9;
}
.sheen{background-image:radial-gradient(130% 100% at 50% -10%,rgba(255,252,235,.22) 0%,transparent 50%)}

.surface{
  position:absolute;inset:0;display:flex;flex-direction:column;
  padding:22px 18px 20px;
  padding-top:max(22px,env(safe-area-inset-top));
  padding-bottom:max(20px,env(safe-area-inset-bottom));
}
/* Le bandeau est hors du flux : il ne deplace jamais le contenu d'un ecran a
   l'autre. La surface se contente de lui reserver sa hauteur. */
.surface.avec-bandeau{padding-top:calc(var(--bandeau-h) + 10px)}

/* ============================================================
   BANDEAU DE SCORE - permanent sur les ecrans de jeu.
   Absent du tampon, du tirage et de la fin : la pleine couleur y est
   le signal, un bandeau bicolore le casserait.
   ============================================================ */
#bandeau{
  position:absolute;top:0;left:0;right:0;height:var(--bandeau-h);
  display:none;z-index:2;
  padding-top:env(safe-area-inset-top);
}
#bandeau.on{display:flex}
#bandeau .moitie{
  flex:1;display:flex;align-items:center;gap:14px;padding:0 20px;
  color:#fff;
}
#bandeau .lichen{background:var(--lichen);justify-content:flex-start}
#bandeau .braise{background:var(--braise);justify-content:flex-end}
#bandeau .av{font-size:32px}
#bandeau .pts{font-weight:800;font-size:40px;line-height:1}
#bandeau .pts.chaud{text-shadow:0 0 0 #fff}
#bandeau .feu{font-size:22px}

/* ============================================================
   ECRANS
   ============================================================ */
.screen{display:none;flex-direction:column;height:100%;gap:10px}
.screen.on{display:flex}
#s-grille,#s-confirm{gap:12px}
.grow{flex:1}
/* Centrage d'un ecran entier : ne touche pas a `display`, sinon la regle
   ecraserait le `display:none` de .screen et l'ecran resterait visible. */
.pile-centre{align-items:center;justify-content:center;text-align:center}
.centre{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.tete{text-align:center}

/* Aucune animation, aucune transition : le prototype est strictement
   statique. Seul l'enfoncement du bouton reste, et il est instantane -
   c'est le seul retour qui confirme au joueur que son tap est passe. */

/* ============================================================
   TYPOGRAPHIE
   ============================================================ */
.kicker{font-weight:700;font-size:14px;letter-spacing:.2em;text-transform:uppercase;opacity:.78}

/* ============================================================
   EMOJI
   Un glyphe emoji ne remplit qu'environ 80% de sa boite : le reste est du
   vide de chasse et d'interligne, herite de la police de texte. Sans
   correction il flotte au milieu d'un blanc, se decolle de son libelle,
   et deux avatars cote a cote s'ecartent.
   On impose la police emoji du systeme, on resserre l'interligne sous 1,
   et les suites d'avatars se chevauchent legerement.
   ============================================================ */
.geant,.avatar-xl,.re-emoji,.tv-avatars,.jeton .e,.grid8 .btn .e,
.carte-eq .e,.ch-qui .e,#bandeau .av,#bandeau .feu{
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",
              "Twemoji Mozilla",sans-serif;
  display:block;
  /* Interligne 1 : la boite fait exactement la taille du glyphe. En
     dessous, le dessin deborde et recouvre le libelle qui suit - c'est
     ce qui arrive des .95 sur les avatars de 80px. L'air se retire donc
     dans les gouttieres, pas dans l'interligne. */
  line-height:1;
  letter-spacing:0;
}
/* La boite serree ne sert qu'a supprimer le vide INVISIBLE de l'interligne.
   L'ecart au libelle, lui, est pose explicitement ci-dessous : c'est la
   seule facon d'obtenir le meme air a 25px et a 132px. */
.geant,.avatar-xl,.re-emoji,.tv-avatars{margin-bottom:.16em}
.carte-eq .e{margin-bottom:.22em}
.grid8 .btn .e{margin-bottom:.28em}
/* Suites d'avatars : les glyphes se serrent au lieu de laisser deux blancs.
   Pas de marge compensatrice : elle poussait le dernier avatar sous le
   coin arrondi de l'appareil. */
.tv-avatars,#bandeau .av{letter-spacing:-.09em}
.geant{font-size:110px}
.avatar-xl{font-size:132px}
.titre-eq{font-weight:800;font-size:38px;line-height:1.02;margin-top:6px;transform:rotate(-1.4deg)}
.sous{font-weight:700;font-size:25px;line-height:1.15;margin-top:2px;opacity:.92}

/* ============================================================
   TOUCHES
   Plus de relief : ni socle, ni ombre, ni deplacement. Le faux volume
   ne tenait pas - il mordait sur les gouttieres, se melangeait au fond,
   et lisait mal a bout de bras.
   Une touche est ici un aplat cerne d'un trait franc, dans l'esprit des
   tampons du jeu. L'appui l'ENCRE : la face prend la couleur du libelle
   et le libelle celle de la face. Instantane, sans mouvement, et jamais
   ambigu - on voit du premier coup d'oeil quelle touche a repondu.
   ============================================================ */
.btn{
  --trait:rgba(61,43,22,.4);
  border:3px solid var(--trait);
  border-radius:18px;
  cursor:pointer;
  font-weight:800;font-size:20px;
  min-height:52px;
  padding-inline:14px;
  background:var(--face,var(--creme));
  color:var(--label,var(--sombre));
}
/* L'encrage : inversion pure face/libelle, valable pour toutes les touches. */
.btn:active:not(:disabled){
  background:var(--label,var(--sombre));
  color:var(--face,var(--creme));
  border-color:var(--label,var(--sombre));
}
.btn:disabled{cursor:default}
.btn.plat{--face:transparent;--label:var(--ink);--trait:currentColor;opacity:.75}
.btn.clair{--face:#fffaea;--label:var(--sombre);--trait:rgba(61,43,22,.4)}
.btn.sombre{--face:var(--sombre);--label:#f7edd4;--trait:var(--sombre)}
.btn.grand{min-height:74px;border-radius:20px;font-size:25px}

/* Rangee de boutons en pied d'ecran : pleine largeur de colonne, ~110px. */
.pied{display:flex;gap:9px;height:110px;flex:none}
.pied .btn{flex:1;min-height:0;height:100%;border-radius:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding-inline:6px}
.pied .btn:disabled{--face:transparent;--trait:currentColor;opacity:.38}
.pied .chiffre{font-weight:800;font-size:44px;line-height:1}
.pied .label{font-weight:700;font-size:14px;line-height:1.15;opacity:.85;text-align:center}

/* ============================================================
   MISE EN PLACE
   ============================================================ */
.recap{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;align-items:center;
  min-height:52px;padding:7px;border-radius:18px;background:rgba(28,18,6,.16)}
.jeton{display:flex;align-items:center;gap:8px;padding:5px 13px 5px 10px;border-radius:99px;
  font-weight:800;font-size:15px}
.jeton .e{font-size:25px}
.jeton.p-lichen{background:var(--lichen);color:var(--lichen-encre)}
.jeton.p-braise{background:var(--braise);color:var(--braise-encre)}
.vide-note{font-weight:700;font-size:16px;opacity:.6}
.premier{text-align:center;font-weight:700;font-size:16px;line-height:1.25;opacity:.85;padding:0 6px}
.grid8{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid8 .btn{min-height:44px;border-radius:20px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;--face:#fffaea;--trait:rgba(61,43,22,.28)}
.grid8 .btn .n{margin-top:0}
.grid8 .btn .e{font-size:40px}
.grid8 .btn .n{font-weight:800;font-size:16px;line-height:1.1}
.grid8 .btn:disabled{--face:transparent;--label:var(--ink);--trait:currentColor;opacity:.3}

/* ============================================================
   CONFIRMATION
   ============================================================ */
.titre-confirm{text-align:center;font-weight:800;font-size:30px;line-height:1.05;transform:rotate(-1deg)}
.cf-corps{flex:1;display:flex;flex-direction:column;gap:12px}
.carte-eq{flex:1;border-radius:24px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px}
.carte-eq .nom{font-weight:800;font-size:22px;line-height:1.05}
.carte-eq .duo{display:flex;gap:18px;align-items:flex-end}
.carte-eq .e{font-size:80px}
.carte-eq .n{font-weight:800;font-size:16px}
.eq-lichen{background:var(--lichen);color:var(--lichen-encre);border:4px solid var(--lichen-fond)}
.eq-braise{background:var(--braise);color:var(--braise-encre);border:4px solid var(--braise-fond)}

/* ============================================================
   TIRAGE / TAMPONS
   ============================================================ */
.titre-sort{font-weight:800;font-size:46px;line-height:1.02;transform:rotate(-1.5deg);padding:0 4px}
.tp-titre{font-weight:800;font-size:34px;line-height:1.06;padding:0 6px;transform:rotate(-1deg)}
.tp-sous{font-weight:700;font-size:19px;line-height:1.28;opacity:.9;padding:0 10px}
.btn.serment{min-height:96px;border-radius:22px;font-size:22px;line-height:1.2;padding-inline:16px}
.tv-avatars{font-size:96px}

/* ============================================================
   CHOIX DU MOT ET PARI - un seul ecran, deux taps.
   ============================================================ */
.ch-qui{display:flex;align-items:center;justify-content:center;gap:11px;flex:none;
  font-weight:700;font-size:18px;line-height:1.2;opacity:.75}
.ch-qui .e{font-size:26px;flex:none}
.mots{flex:1;display:flex;flex-direction:column;gap:8px}
.mots .btn{flex:1;border-radius:20px;display:flex;align-items:center;justify-content:space-between;
  padding-inline:16px;--trait:rgba(61,43,22,.3)}
.mots .m{font-weight:800;font-size:29px}
.mots .v{font-weight:800;font-size:19px;padding:5px 12px;border-radius:99px}
.mots .btn.attenue{opacity:.32}
/* Le mot retenu : meme aplat, trait dore epaissi. */
.mots .btn.sel{--face:#fff;--trait:var(--or);border-width:5px}
.v10{background:var(--menthe);color:var(--sombre)}
.v20{background:var(--or);color:var(--sombre)}
.v30{background:var(--braise);color:var(--braise-encre)}

/* ============================================================
   CONTRE - ecran de memorisation. Le mot domine, les boutons se tassent.
   ============================================================ */
.co-mot{font-weight:800;font-size:72px;line-height:1.02;padding:0 4px;word-break:break-word}
.co-val{font-weight:800;font-size:32px;line-height:1;margin-top:6px;opacity:.92}
.co-memo{font-weight:700;font-size:21px;line-height:1.3;margin-top:22px}
.co-pari{font-weight:800;font-size:28px;line-height:1.2;margin-top:18px;opacity:.95}
.co-regle{font-weight:700;font-size:15px;line-height:1.25;margin-top:4px;opacity:.7}

/* ============================================================
   ARBITRAGE - une seule question, deux boutons, ecran stable.
   ============================================================ */
/* Le contrat du tour, rappele aux arbitres : qui joue, en combien de coups,
   qui donne et qui devine. Sans ce rappel ils arbitrent a l'aveugle. */
.ar-contrat{flex:none;text-align:center;font-weight:800;font-size:22px;line-height:1.2}
.ar-roles{flex:none;text-align:center;font-weight:700;font-size:15px;line-height:1.25;opacity:.7}
/* Le nombre d'indices prime sur tout le reste : c'est la seule donnee que
   les arbitres doivent tenir en tete pendant la manche. */
.ar-quota{flex:none;text-align:center;margin-top:2px}
.ar-nb{font-weight:800;font-size:104px;line-height:.9}
.ar-nb-lib{font-weight:700;font-size:15px;letter-spacing:.18em;text-transform:uppercase;opacity:.7}
/* Les arbitres doivent savoir ce qui est en jeu pour trancher. Le devineur
   ne tient jamais l'appareil pendant la manche : la valeur ne fuite pas. */
.ar-valeur{font-weight:800;font-size:19px;margin-top:6px;opacity:.9}
.mini-btn{min-height:44px;padding-inline:14px;border-radius:14px;border-width:2px;
  font-weight:700;font-size:15px;--face:transparent;--label:var(--sombre);--trait:rgba(61,43,22,.32)}
.mini-btn:disabled{opacity:.28}

/* Le rappel des interdits EST le bouton de bannissement : cadre parchemin,
   pas un bouton colore. On le lit quand on hesite, on le tape quand on tranche. */
.rappel{
  flex:none;border:2px dashed rgba(61,43,22,.4);border-radius:16px;
  background:rgba(255,250,235,.55);color:var(--sombre);
  font-family:var(--font);text-align:left;cursor:pointer;min-height:44px;
  padding:9px 13px;display:flex;flex-direction:column;gap:1px;
}
.rappel-titre{font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
/* Une liste, pas une phrase : on la lit d'un coup d'oeil quand on hesite. */
.rappel-item{font-weight:700;font-size:14px;line-height:1.35;padding-left:12px;position:relative}
.rappel-item::before{content:"·";position:absolute;left:2px;font-weight:800}
.rappel:active{filter:brightness(.95)}

/* L'oeil occupe le milieu de l'ecran : tant qu'on le maintient, le mot
   prend sa place ; des qu'on relache, il se referme.
   Apres un vol, le coequipier du voleur n'a jamais vu le mot et doit
   pourtant arbitrer - ce bouton n'est pas un confort, c'est la regle. */
/* touch-action:none — sans quoi un doigt qui glisse devient un defilement,
   le navigateur annule le pointeur et le mot disparait tout seul. */
#b-oeil{flex:1;min-height:110px;border-radius:22px;font-size:56px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  touch-action:none;-webkit-user-select:none;user-select:none;
  --face:transparent;--label:var(--sombre);--trait:rgba(61,43,22,.32)}
#b-oeil.montre{--face:#fff;--trait:var(--or);border-width:5px;font-weight:800;font-size:46px}
/* Tant que l'oeil est ferme, le glyphe doit etre rendu en emoji couleur et
   non en caractere texte ; une fois le mot affiche, on revient a la police
   du jeu. L'ecart au libelle est pose en em, comme partout ailleurs. */
#b-oeil:not(.montre) #ar-oeil{font-family:var(--emoji);line-height:1;margin-bottom:.16em}
/* Maintenir n'a pas d'affordance : il faut le dire. */
.ar-aide{font-weight:700;font-size:15px;letter-spacing:.03em;opacity:.55}
#b-oeil.montre .ar-aide{display:none}
.duo-actions{display:flex;gap:10px;height:26%;flex:none}
.duo-actions .btn{flex:1;border-radius:22px;font-size:32px;border-width:4px}
#b-trouve{--face:var(--sombre);--label:#ffeec2;--trait:var(--sombre)}
#b-rate{--face:var(--creme);--label:var(--sombre);--trait:rgba(61,43,22,.45)}

/* ============================================================
   BANNI / RESULTAT / FIN
   ============================================================ */
.bn-titre{font-weight:800;font-size:44px;line-height:1.02;transform:rotate(-1.5deg)}
.bn-note{font-weight:700;font-size:21px;line-height:1.28;opacity:.92;padding:0 8px}
.re-emoji{font-size:104px}
.re-ligne{font-weight:800;font-size:38px;line-height:1.04;padding:0 6px;transform:rotate(-1deg)}
.re-points{font-weight:800;font-size:76px;line-height:1;margin-top:2px}
.re-suite{font-weight:700;font-size:17px;line-height:1.3;opacity:.9;margin-top:16px;padding:0 6px}
.fin-titre{font-weight:800;font-size:34px;line-height:1.04;transform:rotate(-1.4deg)}
.fin-cartes{flex:1;display:flex;flex-direction:column;gap:10px;margin-top:4px}
.fin-cartes .carte-eq{gap:0}
.fin-cartes .nom{font-size:21px}
.fin-cartes .pts{font-weight:800;font-size:62px;line-height:1}

/* ============================================================
   LOG
   ============================================================ */
/* Le bouton du log ne s'affiche qu'entre les temps forts : sur les ecrans de
   verdict, de pari ou de vol, il chevaucherait une zone tactile decisive. */
#debug-open{position:absolute;right:6px;bottom:4px;width:44px;height:44px;border:none;
  border-radius:50%;background:transparent;color:var(--ink);opacity:.32;
  font-weight:700;font-size:13px;cursor:pointer;z-index:3;display:none}
#debug-open.on{display:block}
.log-tete{display:flex;align-items:center;justify-content:space-between}
.log-tete .t{font-weight:800;font-size:24px}
.log-liste{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px;
  -webkit-overflow-scrolling:touch}
.log-liste .l{background:var(--creme);border-radius:12px;padding:8px 10px;
  font:600 12px/1.45 ui-monospace,Menlo,Consolas,monospace;color:var(--sombre);
  word-break:break-word;user-select:text;-webkit-user-select:text}
</style>

<script>
"use strict";

/* ============================================================
   OUTILS
   ============================================================ */
const el = (id) => document.getElementById(id);
/* Le mot le plus cher du corpus : sert a savoir si l'equipe menee peut
   encore atteindre la cible en un seul tour. */
const PLUS_CHER = Math.max.apply(null, Object.keys(CORPUS).map(Number));
const melange = (a) => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=a[i]; a[i]=a[j]; a[j]=t; } return a; };
const CLE_LS = "kowo.equipes.v2";

/* Verrou anti double-tap : tout changement d'ecran gele les taps 400 ms.
   Sans lui, un doigt presse enchaine deux ecrans et brule un secret. */
let verrouJusqu = 0;
const verrouille = () => { verrouJusqu = Date.now() + 400; };
const bloque = () => Date.now() < verrouJusqu;

/* Point d'entree unique pour les taps : ignore les rebonds et les taps fantomes. */
function tap(cible, fn){
  const n = typeof cible === "string" ? el(cible) : cible;
  n.addEventListener("click", (e) => { e.preventDefault(); if (bloque()) return; fn(e); });
}

const avatar = (id) => AVATARS.find((a) => a.id === id) || { nom:"?", emoji:"❓", id:"" };

/* ============================================================
   VOCABULAIRE D'EQUIPE
   Forme longue sur les ecrans solennels, forme courte partout ailleurs.
   ============================================================ */
const long    = (t) => EQUIPES[t].long;
const court   = (t) => EQUIPES[t].court;
const sansArt = (t) => EQUIPES[t].court.replace(/^les\s+/i, "");
const autre   = (t) => (t === "lichen" ? "braise" : "lichen");

/* ============================================================
   ECRANS
   Le bandeau de score accompagne les ecrans de jeu. Il disparait sur le
   tampon, le tirage et la fin : la pleine couleur y porte le message.
   ============================================================ */
const ECRANS = ["s-grille","s-confirm","s-tirage","s-choix","s-tampon","s-contre",
                "s-tampon-vol","s-arbitre","s-banni","s-resultat","s-fin","s-debug"];

/* Le score reste visible partout des que la partie tourne - y compris sur
   les tampons et le tirage. Il n'affiche que le score ACQUIS : jamais les
   points en jeu du tour, qui trahiraient la valeur du mot.
   Hors jeu : la mise en place et la confirmation (pas encore d'equipes),
   et la fin de partie, ou les deux scores occupent deja tout l'ecran. */
const AVEC_BANDEAU = ["s-tirage","s-tampon","s-choix","s-contre",
                      "s-tampon-vol","s-arbitre","s-banni","s-resultat"];

/* Le log reste joignable entre les tours, jamais par-dessus un bouton
   qui tranche : le pied de ces ecrans-la n'est qu'un « continuer ». */
const AVEC_LOG = ["s-grille","s-confirm","s-tirage","s-resultat","s-fin"];

let ecranCourant = "s-grille";
let retourLog = null;

function va(id, teinte){
  ecranCourant = id;
  ECRANS.forEach((e) => el(e).classList.toggle("on", e === id));
  el("app").className = teinte ? "t-" + teinte : "";
  const bandeau = AVEC_BANDEAU.indexOf(id) >= 0 && E.equipes;
  el("bandeau").classList.toggle("on", !!bandeau);
  el("surface").classList.toggle("avec-bandeau", !!bandeau);
  el("debug-open").classList.toggle("on", AVEC_LOG.indexOf(id) >= 0 || id === "s-debug");
  if (bandeau) dessineBandeau();
  verrouille();
}

/* Le bandeau n'affiche que le score acquis : jamais les points en jeu,
   qui trahiraient la valeur du mot au devineur. */
function dessineBandeau(){
  ["lichen","braise"].forEach((t) => {
    el("bd-av-" + t).textContent  = E.equipes[t].map((id) => avatar(id).emoji).join("");
    el("bd-pts-" + t).textContent = E.score[t];
    el("bd-feu-" + t).textContent = E.score[t] >= CIBLE ? "🔥" : "";
  });
}

/* ============================================================
   ETAT
   ============================================================ */
const E = {
  choix: [],                       // ids des avatars, dans l'ordre : 0-1 lichen, 2-3 braise
  reprise: false,
  equipes: null,
  rot: { lichen:0, braise:0 },     // qui ouvre et donne, par equipe
  rotVol: { lichen:0, braise:0 },  // a qui l'on propose de voler, par equipe
  score: { lichen:0, braise:0 },
  catalogue: null,                 // mots melanges au debut, consommes dans l'ordre
  ouvreur: null,
  t: null,                         // tour en cours
  log: [],
  dernierTour: false,              // l'equipe menee joue sa derniere chance
  finie: false,
  resultat: null,
  tampon: null,
  tamponTeinte: null,
  tamponChez: null,
  telephoneChez: null,           // equipe qui tient l'appareil, en ce moment
  propositions: [],
  motChoisi: null
};

const joueur  = (t, i) => E.equipes[t][i];
/* Deux roles, deux rotations independantes : ouvrir le tour et se voir
   proposer un vol. Sans cette separation, le meme joueur d'une equipe
   recevait toutes les propositions de vol de la partie. */
const donneur    = (t) => joueur(t, E.rot[t]);
const donneurVol = (t) => joueur(t, E.rotVol[t]);

/* ============================================================
   MISE EN PLACE - une seule grille, quatre etapes explicites.
   ============================================================ */
const equipeDeLaPlace = (i) => (i < 2 ? "lichen" : "braise");

function dessineMiseEnPlace(){
  const enCours = E.choix.length < 2 ? "lichen" : "braise";

  el("mp-equipe").textContent   = long(enCours);
  el("mp-champion").textContent = "champion " + ((E.choix.length % 2) + 1) + " sur 2";

  const rec = el("mp-recap");
  rec.innerHTML = "";
  if (!E.choix.length){
    const d = document.createElement("div");
    d.className = "vide-note";
    d.textContent = "personne encore";
    rec.appendChild(d);
  }
  E.choix.forEach((id, i) => {
    const a = avatar(id);
    const d = document.createElement("div");
    d.className = "jeton p-" + equipeDeLaPlace(i);
    d.innerHTML = '<span class="e"></span><span class="n"></span>';
    d.querySelector(".e").textContent = a.emoji;
    d.querySelector(".n").textContent = a.nom;
    rec.appendChild(d);
  });

  const p = el("mp-premier");
  if (E.choix.length >= 3)      p.textContent = avatar(E.choix[2]).nom + " parlera en premier pour " + long("braise");
  else if (E.choix.length >= 1) p.textContent = avatar(E.choix[0]).nom + " parlera en premier pour " + long("lichen");
  else                          p.textContent = "";

  const g = el("mp-grid");
  g.innerHTML = "";
  AVATARS.forEach((a) => {
    const b = document.createElement("button");
    const pris = E.choix.indexOf(a.id) >= 0;
    b.className = "btn";
    b.disabled = pris;
    b.setAttribute("aria-label", a.nom);
    b.innerHTML = '<span class="e"></span><span class="n"></span>';
    b.querySelector(".e").textContent = a.emoji;
    b.querySelector(".n").textContent = a.nom;
    if (!pris) tap(b, () => choisitAvatar(a.id));
    g.appendChild(b);
  });

  el("b-retour").disabled = E.choix.length === 0;
  el("b-retour").style.opacity = E.choix.length ? 1 : .4;

  va("s-grille", enCours);
}

function choisitAvatar(id){
  if (E.choix.length >= 4 || E.choix.indexOf(id) >= 0) return;
  E.choix.push(id);
  E.reprise = false;
  if (E.choix.length === 4) dessineConfirmation();
  else dessineMiseEnPlace();
}

function reculeMiseEnPlace(){
  if (!E.choix.length) return;
  E.choix.pop();
  E.reprise = false;
  dessineMiseEnPlace();
}

/* ============================================================
   CONFIRMATION DES EQUIPES
   ============================================================ */
function dessineConfirmation(){
  el("cf-titre").textContent    = E.reprise ? "Reprendre les mêmes équipes ?" : "Voilà les équipes";
  el("b-commencer").textContent = E.reprise ? "Reprendre les mêmes équipes"   : "Que la partie commence";
  el("b-changer").textContent   = E.reprise ? "Changer" : "Retour";

  [["cf-lichen", 0], ["cf-braise", 2]].forEach(([id, i]) => {
    const c = el(id);
    const eq = i === 0 ? "lichen" : "braise";
    c.innerHTML = '<div class="nom"></div><div class="duo"></div>';
    c.querySelector(".nom").textContent = long(eq);
    const duo = c.querySelector(".duo");
    [E.choix[i], E.choix[i+1]].forEach((aid) => {
      if (!aid) return;
      const a = avatar(aid);
      const d = document.createElement("div");
      d.innerHTML = '<div class="e"></div><div class="n"></div>';
      d.querySelector(".e").textContent = a.emoji;
      d.querySelector(".n").textContent = a.nom;
      duo.appendChild(d);
    });
  });

  va("s-confirm", null);
}

/* ============================================================
   DEMARRAGE D'UNE PARTIE
   ============================================================ */
function commence(){
  E.equipes = { lichen:[E.choix[0], E.choix[1]], braise:[E.choix[2], E.choix[3]] };
  try { localStorage.setItem(CLE_LS, JSON.stringify(E.choix)); } catch(e){}

  E.rot    = { lichen:0, braise:0 };
  E.rotVol = { lichen:0, braise:0 };
  E.score = { lichen:0, braise:0 };
  /* Le catalogue est melange UNE FOIS au debut de la partie, puis consomme
     dans l'ordre. Auparavant chaque tour retirait 5 mots au hasard et n'en
     consommait qu'un : les quatre ecartes revenaient dans la pioche et
     pouvaient se representer au tour suivant. */
  E.catalogue = { 10: melange(CORPUS[10]), 20: melange(CORPUS[20]), 30: melange(CORPUS[30]) };
  E.log = [];
  E.dernierTour = false;
  E.finie = false;
  E.resultat = null;
  E.ouvreur = Math.random() < .5 ? "lichen" : "braise";

  el("tir-equipe").textContent = long(E.ouvreur);
  va("s-tirage", E.ouvreur);
}

/* ============================================================
   TIRAGE DES 5 MOTS
   Le catalogue est melange au debut de la partie et consomme dans l'ordre :
   aucun mot ne peut se representer d'un tour a l'autre.
   ============================================================ */
function tireLaMain(){
  const out = [];
  [10, 20, 30].forEach((v) => {
    for (let i = 0; i < TIRAGE[v]; i++){
      const w = prendMot(v);
      if (w) out.push(w);
    }
  });
  /* Un palier epuise n'est jamais recycle : on complete depuis les autres.
     Un mot n'est donc propose qu'une seule fois par partie, joue ou non. */
  while (out.length < 5){
    const w = prendMot(null);
    if (!w) break;
    out.push(w);
  }
  return melange(out);
}

function prendMot(v){
  if (v && E.catalogue[v].length) return { m: E.catalogue[v].shift(), v: v };
  for (const p of [10, 20, 30]) if (E.catalogue[p].length) return { m: E.catalogue[p].shift(), v: p };
  return null;
}

/* ============================================================
   1. CHOIX DU MOT ET PARI - un seul ecran, deux taps.
   Le tour s'ouvre ici : a ce moment rien n'est encore secret, le
   telephone circule sans ceremonie jusqu'au donneur d'ouverture.
   ============================================================ */
function ouvreLeTour(){
  const op = E.ouvreur;
  const d  = donneur(op);
  /* derniereChance : ce tour est celui accorde a l'equipe menee. C'est le
     seul cas ou une equipe ouvre deux fois de suite, et le log le trace pour
     que la verification puisse distinguer l'entorse assumee d'un bogue. */
  E.t = { ouvreur: op, donneurOuv: d, bans: 0, volPropose: false, derniereChance: E.dernierTour };
  E.telephoneChez = null;                 // en transit
  E.propositions = tireLaMain();
  E.motChoisi = null;

  /* On vide les porteurs de secret du tour precedent : les quatre mots
     ecartes n'ont jamais ete reveles et n'ont rien a faire dans le DOM,
     meme sur un ecran masque. */
  el("ch-mots").innerHTML = "";
  el("co-mot").textContent = "";
  el("ar-oeil").textContent = "👁️";

  /* Le telephone sort des mains des arbitres du tour precedent : il doit
     rejoindre nommement le donneur d'ouverture. Son coequipier devinera,
     et ne doit donc voir ni les cinq mots, ni celui qui sera retenu. Les
     propositions n'entrent dans le DOM qu'apres ce serment. */
  const co = E.equipes[op].filter((x) => x !== d)[0];
  tamponIndividuel(op, d, "Je suis " + avatar(d).nom + ", " + avatar(co).nom + " ne regarde pas",
                   dessineChoix);
}

/* Tampon nominatif : l'appareil doit atterrir dans une main precise, pas
   seulement dans un camp. C'est l'identite affirmee qui protege le secret. */
function tamponIndividuel(equipe, avatarId, serment, suite){
  const a = avatar(avatarId);
  E.tampon = suite;
  E.tamponTeinte = equipe;
  E.tamponChez = equipe;
  el("tp-emoji").textContent  = a.emoji;
  el("tp-titre").textContent  = "Passe le téléphone à " + a.nom;
  el("b-serment").textContent = serment;
  va("s-tampon", equipe);
}

function dessineChoix(){
  const a = avatar(E.t.donneurOuv);
  el("ch-qui").innerHTML = '<span class="e"></span><span class="t"></span>';
  el("ch-qui").querySelector(".e").textContent = a.emoji;
  el("ch-qui").querySelector(".t").textContent = a.nom + " choisit et parie";

  const box = el("ch-mots");
  box.innerHTML = "";
  E.propositions.forEach((w, i) => {
    const b = document.createElement("button");
    b.className = "btn";
    b.innerHTML = '<span class="m"></span><span class="v v' + w.v + '"></span>';
    b.querySelector(".m").textContent = w.m;
    b.querySelector(".v").textContent = w.v;
    tap(b, () => { E.motChoisi = i; majChoix(); });
    box.appendChild(b);
  });

  majChoix();
  va("s-choix", null);
}

/* Un mot s'illumine, les autres s'estompent ; les paris s'activent. */
function majChoix(){
  const enfants = el("ch-mots").children;
  for (let i = 0; i < enfants.length; i++){
    enfants[i].classList.toggle("sel", E.motChoisi === i);
    enfants[i].classList.toggle("attenue", E.motChoisi !== null && E.motChoisi !== i);
  }
  [1,2,3].forEach((n) => { el("b-pari-" + n).disabled = E.motChoisi === null; });
}

/* ============================================================
   2. TAMPON D'OUVERTURE - le seul passage obligatoire du tour.
   Le mot n'est rendu dans le DOM qu'apres le serment.
   ============================================================ */
function annoncePari(n){
  if (E.motChoisi === null) return;
  const w = E.propositions[E.motChoisi];
  E.t.mot = w.m;
  E.t.val = w.v;
  E.t.pariOuv = n;

  /* Un pari a 1 coup est involable : le donneur adverse n'a aucune decision a
     prendre, et il n'a donc aucune raison de voir le mot. On saute le tampon
     individuel et l'ecran de contre - le telephone ira directement a la paire
     adverse, qui arbitre, par le tampon collectif de trancheLeContre(). */
  if (n === 1){ trancheLeContre(false, 0); return; }

  const adv = autre(E.t.ouvreur);
  const d   = donneurVol(adv);
  E.t.donneurAdv = d;
  E.t.volPropose = true;

  tamponIndividuel(adv, d, "Je suis " + avatar(d).nom + ", je jure de ne rien avoir vu",
                   dessineContre);
}

/* ============================================================
   3. CONTRE - ecran de memorisation.
   Seul moment ou le donneur adverse voit le mot. S'il vole, il ne le
   reverra plus : le mot domine, le pari adverse passe dessous.
   ============================================================ */
function dessineContre(){
  const t = E.t;
  el("co-mot").textContent  = t.mot;
  el("co-val").textContent  = t.val + " points";
  el("co-pari").textContent = court(t.ouvreur) + " parient " + t.pariOuv;

  /* On ne vole qu'en annoncant strictement moins que le pari en cours :
     a pari egal, le bouton est grise et le dit. */
  [1,2].forEach((n) => {
    const possible = VOL_AUTORISE && n < t.pariOuv;
    const b = el("b-voler-" + n);
    b.disabled = !possible;
    b.querySelector(".label").textContent = possible ? "voler" : "impossible";
  });

  va("s-contre", autre(t.ouvreur));
}

/* Le contre tranche : qui joue le mot, avec combien de coups, et qui arbitre.
   Sans vol, le telephone est deja chez les arbitres : aucun passage.
   Avec vol, il doit rejoindre l'equipe volee : un tampon collectif. */
function trancheLeContre(vol, n){
  const t = E.t;
  t.vol      = vol;
  t.preneur  = vol ? autre(t.ouvreur) : t.ouvreur;
  t.pari     = vol ? n : t.pariOuv;
  t.donneur  = vol ? t.donneurAdv : t.donneurOuv;
  t.devineur = E.equipes[t.preneur].filter((x) => x !== t.donneur)[0];
  t.arbitre  = autre(t.preneur);

  E.motVisible = false;

  /* Le telephone est-il deja dans le camp qui arbitre ? Sans vol apres un
     contre, oui : aucun passage. Apres un vol, ou apres un pari involable,
     non : il doit rejoindre les arbitres. */
  if (E.telephoneChez === t.arbitre){ dessineArbitrage(); return; }

  E.tampon = dessineArbitrage;
  E.tamponTeinte = t.arbitre;
  E.tamponChez = t.arbitre;
  el("tv-avatars").textContent = E.equipes[t.arbitre].map((id) => avatar(id).emoji).join("");
  el("tv-titre").textContent   = "Le téléphone passe aux " + sansArt(t.arbitre);
  va("s-tampon-vol", t.arbitre);
}

/* ============================================================
   4. MANCHE - une seule validation, a la fin.
   Les arbitres ne tranchent plus indice par indice : la manche se joue a
   voix haute, puis ils tapent une seule fois, `Trouve` ou `Rate`.
   L'ecran ne change pas de forme du debut a la fin.
   ============================================================ */
function dessineArbitrage(){
  const t = E.t;
  const coups = t.pari + (t.pari > 1 ? " coups" : " coup");

  el("ar-contrat").textContent = t.vol
    ? court(t.preneur) + " ont volé en " + coups
    : court(t.preneur) + " jouent en " + coups;
  el("ar-roles").textContent = avatar(t.donneur).nom + " donne · " + avatar(t.devineur).nom + " devine";
  el("ar-nb").textContent = t.pari;
  el("ar-nb-lib").textContent = t.pari > 1 ? "indices au plus" : "indice au plus";
  el("ar-valeur").textContent = "le mot vaut " + t.val + " points";

  E.motVisible = false;
  majOeil();
  va("s-arbitre", null);
}

/* Le mot prend la place de l'oeil, et inversement. */
function majOeil(){
  el("b-oeil").classList.toggle("montre", E.motVisible);
  el("ar-oeil").textContent = E.motVisible ? E.t.mot : "👁️";
}

function dessineBanni(){
  el("bn-note").textContent = "Le tour s’arrête · +" + E.t.val + " pour " + court(E.t.arbitre);
  va("s-banni", E.t.arbitre);
}

/* ============================================================
   5. RESOLUTION
   ============================================================ */
function conclut(issue, gagnant){
  const t = E.t;

  E.score[gagnant] += t.val;

  /* EQUITE — trois alternances independantes, qu'un vol ne perturbe jamais.
     1. l'ouverture passe a l'autre equipe, vol ou pas ;
     2. dans l'equipe qui vient d'ouvrir, le donneur suivant est l'autre ;
     3. dans l'equipe a qui l'on a propose de voler, la prochaine
        proposition ira a l'autre.
     Sur quatre tours, chacun des quatre joueurs ouvre donc exactement une
     fois, et se voit proposer un vol exactement une fois. */
  E.rot[t.ouvreur] = 1 - E.rot[t.ouvreur];
  if (t.volPropose) {
    const adv = autre(t.ouvreur);
    E.rotVol[adv] = 1 - E.rotVol[adv];
  }

  /* ---------- LA FIN ----------
     Atteindre la cible ne suffit pas a gagner. Une fois qu'une equipe l'a
     franchie, on se demande ce que l'equipe menee peut encore faire avec le
     mot le plus cher du corpus :
     - si cela ne lui suffit ni a atteindre la cible ni a passer devant, il
       n'y a plus rien a jouer et la partie s'arrete ;
     - sinon elle a droit a un dernier tour, qu'elle ouvre elle-meme — la
       seule entorse assumee a l'alternance ;
     - et tant que les deux equipes sont a egalite, on relance : une partie
       ne se termine jamais sur un score nul. */
  const meneur  = E.score.lichen >= E.score.braise ? "lichen" : "braise";
  const suiveur = autre(meneur);
  const egalite = E.score.lichen === E.score.braise;
  const auMieux = E.score[suiveur] + PLUS_CHER;
  let suivant = autre(t.ouvreur);
  let finie   = false;

  if (E.score[meneur] < CIBLE){
    E.dernierTour = false;                       // la partie suit son cours
  } else if (egalite){
    E.dernierTour = false;                       // on rejoue pour se departager
  } else if (E.dernierTour){
    finie = true;                                // la derniere chance vient d'etre jouee
  } else if (auMieux >= CIBLE && auMieux > E.score[meneur]){
    E.dernierTour = true;
    suivant = suiveur;                           // l'equipe menee ouvre son dernier tour
  } else {
    finie = true;                                // elle ne peut plus ni atteindre, ni passer
  }

  E.log.push({
    n: E.log.length + 1, ouvre: court(t.ouvreur), donneurOuv: avatar(t.donneurOuv).nom,
    mot: t.mot, val: t.val, pariOuv: t.pariOuv, contre: t.vol ? "o" : "n",
    pariRetenu: t.pari, preneur: court(t.preneur), donneurRetenu: avatar(t.donneur).nom,
    issue: issue, points: court(gagnant), main: t.vol ? "o" : "n", bans: t.bans,
    derniere: t.derniereChance ? "o" : "n"
  });

  E.ouvreur  = suivant;
  E.finie    = finie;
  E.resultat = { issue: issue, gagnant: gagnant, val: t.val, finie: finie };

  dessineResultat();
}

/* Deux equipes a egalite ne peuvent pas terminer la partie. */
const egaliteEnCours = () => E.score.lichen === E.score.braise && E.score.lichen > 0;

const EMOJI_ISSUE   = { "trouvé":"🎉", "quota épuisé":"💀", "indice refusé":"⛔" };
const LIBELLE_ISSUE = { "trouvé":"mot trouvé", "quota épuisé":"quota épuisé", "indice refusé":"indice refusé" };

function dessineResultat(){
  const r = E.resultat;
  el("re-emoji").textContent  = EMOJI_ISSUE[r.issue];
  el("re-issue").textContent  = LIBELLE_ISSUE[r.issue];
  el("re-ligne").textContent  = court(r.gagnant) + " encaissent";
  el("re-points").textContent = "+" + r.val;

  el("re-suite").textContent =
      r.finie        ? "Plus rien à jouer. On compare."
    : E.dernierTour  ? court(E.ouvreur) + " jouent leur dernière chance."
    : egaliteEnCours() ? "Égalité — on relance pour se départager."
    :                  "Ouverture aux " + sansArt(E.ouvreur) + ".";

  el("b-suite").textContent = E.finie ? "Voir le vainqueur" : "Tour suivant";
  va("s-resultat", r.gagnant);
}

function dessineFin(){
  const s = E.score;
  el("fin-titre").textContent = s.lichen === s.braise
    ? "Égalité parfaite"
    : long(s.lichen > s.braise ? "lichen" : "braise") + " l’emportent";
  el("fin-lichen").textContent = s.lichen;
  el("fin-braise").textContent = s.braise;
  va("s-fin", null);
}

/* ============================================================
   LOG - une ligne par tour. Les deux dernieres colonnes mesurent
   l'effet du passage du bannissement en bouton facultatif : si le taux
   tombe a zero, l'arbitrage a disparu du jeu.
   ============================================================ */
/* Plus de colonne « coup de fin » ni « coup du bannissement » : avec une
   validation unique en fin de manche, il n'y a plus de coup a numeroter. */
const ENTETE_LOG = "tour|ouvre|donneur|mot|valeur|pari ouv|contré|pari retenu|preneur|donneur retenu|issue|points à|main par vol|bannissements|dernière chance";

const ligneLog = (l) => [l.n, l.ouvre, l.donneurOuv, l.mot, l.val, "pari " + l.pariOuv,
  "contré " + l.contre, "retenu " + l.pariRetenu, l.preneur, l.donneurRetenu, l.issue,
  "+" + l.val + " " + l.points, "vol " + l.main, "bans " + l.bans,
  l.derniere === "o" ? "dernière chance" : "—"].join(" | ");

function dessineLog(){
  el("lg-titre").textContent = "Log · " + E.log.length + " tours";
  const box = el("lg-liste");
  box.innerHTML = "";
  if (!E.log.length){
    const d = document.createElement("div");
    d.className = "vide-note";
    d.style.padding = "8px 2px";
    d.textContent = "Aucun tour joué.";
    box.appendChild(d);
  }
  E.log.forEach((l) => {
    const d = document.createElement("div");
    d.className = "l";
    d.textContent = ligneLog(l);
    box.appendChild(d);
  });
  el("b-copier").textContent = "Copier le log";
  va("s-debug", null);
}

function copieLog(){
  const texte = ENTETE_LOG + "\n" + E.log.map((l) => [l.n, l.ouvre, l.donneurOuv, l.mot, l.val,
    l.pariOuv, l.contre, l.pariRetenu, l.preneur, l.donneurRetenu, l.issue,
    l.points, l.main, l.bans, l.derniere].join("|")).join("\n");
  try {
    navigator.clipboard.writeText(texte);
    el("b-copier").textContent = "Copié ✓";
    setTimeout(() => { el("b-copier").textContent = "Copier le log"; }, 1600);
  } catch(e){
    /* Presse-papier refuse : le log reste lisible et selectionnable a l'ecran. */
  }
}

/* ============================================================
   CABLAGE
   ============================================================ */
tap("b-retour",       reculeMiseEnPlace);
tap("b-commencer",    commence);

/* L'oeil s'ouvre a l'appui et se referme au relachement, et a rien d'autre.
   Surtout pas a `pointerleave` : le doigt qui glisse de quelques pixels
   sort de la touche et refermait le mot en pleine lecture. On ecoute donc
   le relachement sur la FENETRE, pas sur le bouton - ou qu'il tombe, il
   referme. Le mot ne peut ainsi jamais rester affiche sur un appareil
   pose, sans pour autant clignoter des qu'on bouge. */
(function boutonOeil(){
  const b = el("b-oeil");
  const montre = (v) => {
    if (v && (!E.t || !E.t.mot)) return;
    if (E.motVisible === v) return;
    E.motVisible = v;
    majOeil();
  };
  const ferme = () => montre(false);
  b.addEventListener("pointerdown", (e) => {
    if (bloque()) return;
    e.preventDefault();                   // pas de selection, pas de loupe
    montre(true);
  });
  /* Le relachement peut arriver n'importe ou : hors du bouton, hors de la
     page, ou jamais (onglet masque, appel entrant). Tous referment. */
  ["pointerup","pointercancel"].forEach((ev) => window.addEventListener(ev, ferme));
  window.addEventListener("blur", ferme);
  document.addEventListener("visibilitychange", () => { if (document.hidden) ferme(); });
  b.addEventListener("contextmenu", (e) => e.preventDefault());
})();

tap("b-copier",       copieLog);

/* Un tampon confirme, c'est l'appareil qui a change de camp. */
function confirmeTampon(){
  const suite = E.tampon;
  E.tampon = null;
  if (E.tamponChez) E.telephoneChez = E.tamponChez;
  if (suite) suite();
}

/* Rendu de l'ecran courant, pour revenir du log exactement ou on etait. */
function redessineCourant(){
  const table = {
    "s-grille": dessineMiseEnPlace, "s-confirm": dessineConfirmation,
    "s-tirage": () => va("s-tirage", E.ouvreur),
    "s-choix": dessineChoix,
    "s-tampon": () => va("s-tampon", E.tamponTeinte),
    "s-contre": dessineContre,
    "s-tampon-vol": () => va("s-tampon-vol", E.tamponTeinte),
    "s-arbitre": dessineArbitrage, "s-banni": dessineBanni,
    "s-resultat": dessineResultat, "s-fin": dessineFin
  };
  return table[ecranCourant] || dessineMiseEnPlace;
}

/* ============================================================
   DEMARRAGE
   ============================================================ */
(function demarre(){
  try {
    const brut = localStorage.getItem(CLE_LS);
    if (brut){
      const p = JSON.parse(brut);
      if (Array.isArray(p) && p.length === 4 && p.every((id) => AVATARS.some((a) => a.id === id))){
        E.choix = p;
        E.reprise = true;
        dessineConfirmation();
        return;
      }
    }
  } catch(e){}
  dessineMiseEnPlace();
})();

/* ============================================================
   MANIFEST PWA - genere en memoire, pour « ajouter a l'ecran d'accueil »
   sans second fichier.
   ============================================================ */
(function manifestPWA(){
  let icone = "";
  try {
    const c = document.createElement("canvas");
    c.width = c.height = 512;
    const x = c.getContext("2d");
    x.fillStyle = "#f3e6c8"; x.fillRect(0, 0, 512, 512);
    x.fillStyle = "#2f9c86"; x.beginPath(); x.arc(256, 256, 150, Math.PI/2, Math.PI*1.5); x.fill();
    x.fillStyle = "#d8511f"; x.beginPath(); x.arc(256, 256, 150, Math.PI*1.5, Math.PI/2); x.fill();
    x.fillStyle = "#f7edd4"; x.font = "800 190px " + getComputedStyle(document.body).fontFamily;
    x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("K", 256, 268);
    icone = c.toDataURL("image/png");
  } catch(e){}
  const base = location.href.split("#")[0];
  const m = {
    name: "Kowo", short_name: "Kowo",
    start_url: base, scope: base,
    display: "fullscreen", orientation: "portrait",
    background_color: "#f3e6c8", theme_color: "#f3e6c8",
    icons: icone ? [
      { src: icone, sizes: "512x512", type: "image/png", purpose: "any" },
      { src: icone, sizes: "512x512", type: "image/png", purpose: "maskable" }
    ] : []
  };
  try {
    el("mf").href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: "application/manifest+json" }));
  } catch(e){}
})();
